[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "english-forge-ai"
version = "1.0.0"
description = "EnglishForge AI service: chat, translation, word explanation and conversation generation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-or-later"
authors = [{ name = "EnglishForge Team" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.0,<3.0",
    "openai>=1.40,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["node_modules", "dist"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "N",
    "RUF",
]
# E501 由 line-length 统一约束；RUF001-003 会把中文标点误报为歧义字符。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["ai"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的 Depends() 在默认参数位置调用是官方推荐写法，属误报。
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "src"
packages = ["ai"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
