server {
    listen 80;
    server_name _;

    # 录音以 base64 内嵌在 JSON 请求体里上传（POST /speech/score/shadow）。
    # 30 秒 16kHz/16bit 单声道 ≈ 0.96MB 原始 → base64 后 ≈ 1.3MB，长句跟读更大。
    # nginx 默认 client_max_body_size 仅 1m，超限直接 413，前端只看到「评分失败」。
    client_max_body_size 20m;

    # API proxy
    # NestJS 端 setGlobalPrefix('api/v1')，服务端路由本身带 /api 前缀，
    # 所以这里 proxy_pass 不带 URI，完整原路径原样转发。
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Speech service proxy
    # ⚠️ proxy_pass 必须带尾部 `/`：speech 服务的路由是**无 /speech 前缀**的
    # （/score/shadow、/score/spell、/align/phoneme、/tts、/healthz），
    # 而前端一律按 /speech/... 调用。proxy_pass 带 URI 时，nginx 会用该 URI 替换
    # location 匹配到的前缀 `/speech/`，于是 /speech/score/shadow → /score/shadow。
    # 若写成不带 URI 的 `proxy_pass http://speech:8001;`，`/speech/...` 会整段原样
    # 转发，服务没有该路由 → 全部 404（此前的实际状态）。
    location /speech/ {
        proxy_pass http://speech:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 开启真实声学引擎后（--build-arg WITH_PIPELINE=1）单条评分从毫秒级升到秒级。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # AI service proxy
    # 与 speech 同理：服务路由无 /ai 前缀（/chat、/translate、/explain、
    # /speak-practice、/conversation-generate、/healthz），必须带尾部 `/` 剥离前缀。
    location /ai/ {
        proxy_pass http://ai:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Media files
    # media 控制器挂在 NestJS 全局前缀之外，按原路径返回，因此保留 /media/。
    location /media/ {
        proxy_pass http://api:3000/media/;
        proxy_set_header Host $host;
    }

    # Frontend (React SPA)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}
